[project]
name = "re-workbench-server"
version = "0.1.0"
description = "Ghidra-powered reverse engineering MCP server"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0,<2",
    "pyghidra>=2.1.0",
    "lief>=0.15.0",
]

[project.scripts]
re-workbench-server = "re_workbench_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/re_workbench_server"]
